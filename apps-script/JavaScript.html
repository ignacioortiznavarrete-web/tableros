<script>
  const APP = {
    data: null,
    vista: 'SOLICITUD',
    filtro: 'etapa',     // 'etapa' | 'todas'
    busqueda: '',
    foco: null           // número de solicitud a resaltar
  };

  /* ===================== Arranque ===================== */

  document.addEventListener('DOMContentLoaded', cargar);

  function cargar() {
    google.script.run
      .withSuccessHandler(function (data) {
        APP.data = data;
        if (data.roles.length && data.roles.indexOf('PMO') < 0) APP.vista = data.roles[0];
        renderUser();
        render();
      })
      .withFailureHandler(function (err) {
        document.getElementById('main').innerHTML =
          '<div class="notice bad">' + esc(err.message || err) + '</div>';
      })
      .getInicio();
  }

  function refrescar() {
    google.script.run
      .withSuccessHandler(function (lista) { APP.data.solicitudes = lista; render(); toast('Datos actualizados'); })
      .withFailureHandler(errorToast)
      .getSolicitudes();
  }

  /* ===================== Helpers ===================== */

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(v) { return String(v || '').replace(/\s+/g, ' ').trim().toUpperCase(); }
  function unicos(arr) { return arr.filter(function (x, i) { return arr.indexOf(x) === i; }); }
  function etapa(id) { return APP.data.etapas.filter(function (e) { return e.id === id; })[0]; }
  function idxEtapa(id) { return APP.data.etapas.findIndex(function (e) { return e.id === id; }); }
  function estadoDe(s, id) { return s.etapas[idxEtapa(id)] || {}; }
  /** La etapa `id` tiene trabajo pendiente en la solicitud `s`. */
  function pendienteEn(s, id) {
    const st = estadoDe(s, id);
    return s.etapaActual === etapa(id).paso && st.aplica && st.estado !== 'Aprobado';
  }
  function etiquetaCondicion(c) {
    return c === 'exportacion' ? 'Sólo exportación' : c === 'produccion' ? 'Si requiere producción' : '';
  }
  function esMio(id) { return APP.data.roles.indexOf(id) >= 0; }
  function nombreDesdeCorreo(email) {
    return String(email || '').split('@')[0].split(/[._-]+/).filter(Boolean)
      .map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1); }).join(' ');
  }

  function clasePill(estado) {
    const e = String(estado || '').toLowerCase();
    if (e.indexOf('rechaz') >= 0) return 'bad';
    if (e.indexOf('aprob') >= 0 || e.indexOf('finaliz') >= 0) return 'ok';
    if (e.indexOf('revisi') >= 0) return 'info';
    if (e) return 'warn';
    return '';
  }

  function toast(msg, tipo) {
    const t = document.createElement('div');
    t.className = 'toast ' + (tipo || '');
    t.textContent = msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, tipo === 'bad' ? 7000 : 3500);
  }
  function errorToast(err) { toast(err && err.message ? err.message : String(err), 'bad'); }

  function cargando(btn, on, texto) {
    if (on) {
      btn.dataset.txt = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>' + esc(texto || 'Guardando…');
    } else {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.txt || btn.innerHTML;
    }
  }

  /* ===================== Cabecera ===================== */

  function renderUser() {
    const d = APP.data;
    const roles = d.admin ? '<span class="role admin" title="Puede actuar en todas las etapas">Administrador · todas las etapas</span>' :
      d.roles.map(function (r) { return '<span class="role">' + esc(etapa(r).nombre) + '</span>'; }).join('');
    document.getElementById('user').innerHTML =
      '<span class="email">' + esc(d.usuario) + '</span>' + (roles || '<span class="role">Consulta</span>');
  }

  /* ===================== Línea de tiempo superior ===================== */

  function renderFlow() {
    const sols = APP.data.solicitudes;
    function nodo(e, num, sub) {
      const n = sols.filter(function (s) { return pendienteEn(s, e.id); }).length;
      const cls = [sub ? 'flow-sub' : 'flow-step'];
      if (e.id === APP.vista) cls.push('active');
      if (n) cls.push('has-work');
      const mio = esMio(e.id);
      const cond = etiquetaCondicion(e.condicion);
      return '<button class="' + cls.join(' ') + '" data-vista="' + e.id + '">' +
        '<span class="flow-dot">' + esc(num) +
          (n && mio ? '<span class="flow-badge">' + n + '</span>' : '') + '</span>' +
        '<span class="flow-label">' + esc(e.nombre) + '</span>' +
        '<span class="flow-meta">' + (n ? n + ' pendiente' + (n > 1 ? 's' : '') : 'Sin pendientes') + '</span>' +
        (cond ? '<span class="flow-cond">' + esc(cond) + '</span>' : '') +
        (mio ? '<span class="flow-mine">Tu etapa</span>' : '') +
        '</button>';
    }

    let html = '<button class="flow-step' + (APP.vista === 'SOLICITUD' ? ' active' : '') + '" data-vista="SOLICITUD">' +
      '<span class="flow-dot">+</span><span class="flow-label">Solicitud</span>' +
      '<span class="flow-meta">' + sols.length + ' en total</span>' +
      (esMio('PMO') ? '<span class="flow-mine">Tu etapa</span>' : '') + '</button>';

    APP.data.pasos.forEach(function (p, i) {
      const num = String(i + 1);
      if (p.etapas.length === 1) { html += nodo(etapa(p.etapas[0]), num, false); return; }
      html += '<div class="flow-step split">' +
        '<div class="flow-split">' +
          p.etapas.map(function (id, j) { return nodo(etapa(id), num + String.fromCharCode(97 + j), true); }).join('') +
        '</div>' +
        '<span class="flow-group">' + esc(p.nombre) + ' · en paralelo</span>' +
        '</div>';
    });
    document.getElementById('flow').innerHTML = html;
  }

  document.getElementById('flow').addEventListener('click', function (ev) {
    const b = ev.target.closest('[data-vista]');
    if (!b) return;
    APP.vista = b.dataset.vista;
    APP.filtro = 'etapa';
    APP.busqueda = '';
    APP.foco = null;
    render();
  });

  /* ===================== Render principal ===================== */

  function render() {
    renderFlow();
    const main = document.getElementById('main');
    main.innerHTML = APP.vista === 'SOLICITUD' ? vistaSolicitud() : vistaEtapa(APP.vista);
    if (APP.vista === 'SOLICITUD') initFormulario(document.getElementById('form-sol'));
    if (APP.foco) {
      const el = document.getElementById('req-' + APP.foco);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const det = el.querySelector('details');
        if (det) det.open = true;
      }
      APP.foco = null;
    }
  }

  /* ---------- Vista: Solicitud ---------- */

  function vistaSolicitud() {
    const d = APP.data;
    const puedeCrear = esMio('PMO');
    const recientes = d.solicitudes.slice(0, 12);

    const form = puedeCrear ? formularioHtml() :
      '<div class="card-body"><div class="notice">Sólo el PMO (' + esc(etapa('PMO').emails.join(', ')) +
      ') puede ingresar nuevas solicitudes. Puedes revisar el avance en la línea de tiempo.</div></div>';

    const lista = recientes.length ? '<div class="mini">' + recientes.map(function (s) {
      return '<div class="mini-row" data-ir="' + esc(s.numero) + '">' +
        '<div><div class="mini-title">' + esc(s.numero) + ' · ' + esc(s.proyecto) + '</div>' +
        '<div class="mini-sub">' + esc(s.material) + ' · ' + esc(s.tipo) + ' · ' + esc(s.subfamilia) + ' — ' + esc(s.fecha) + '</div></div>' +
        '<span class="pill ' + clasePill(s.estado) + '">' + esc(s.estado) + '</span></div>';
    }).join('') + '</div>' :
      '<div class="empty"><div class="big">📄</div>Aún no hay solicitudes.</div>';

    return '<div class="grid">' +
      '<section class="card"><div class="card-head"><h2>Nueva solicitud de material</h2>' +
      '<p>El material, tipo y subfamilia deben coincidir con la hoja Reglas.</p></div>' + form + '</section>' +
      '<section class="card"><div class="card-head"><h2>Últimas solicitudes</h2>' +
      '<p>Haz clic en una para ver su avance.</p></div><div class="card-body">' + lista + '</div></section>' +
      '</div>';
  }

  /** Formulario de solicitud. Si se pasa `sol`, es el formulario de edición del PMO. */
  function formularioHtml(sol) {
    const d = APP.data;
    const ed = !!sol;
    const sfx = ed ? '-e' : '';
    function v(x) { return ed ? ' value="' + esc(x) + '"' : ''; }
    function opcionesSiNo(actual) {
      return '<option value="">Selecciona…</option>' + ['Sí', 'No'].map(function (o) {
        return '<option' + (actual === o ? ' selected' : '') + '>' + o + '</option>';
      }).join('');
    }
    function valorPrevio(id) {
      const x = ed ? (sol.factibilidad[id] || '') : '';
      return x === 'N/A' ? '' : x;
    }
    let seccionActual = null;
    const preguntas = d.preguntas.map(function (p) {
      const req = p.requerida ? ' <span class="req">*</span>' : '';
      const full = p.tipo === 'textarea' ? ' full' : '';
      let titulo = '';
      if (p.seccion !== seccionActual) {
        titulo = (seccionActual === null ? '' : '</div>') +
          '<div class="section-title">' + esc(p.seccion || 'Factibilidad') + '</div><div class="fields">';
        seccionActual = p.seccion;
      }
      const dep = p.depende ? ' data-dep="' + esc(p.depende.id) + '" data-dep-valor="' + esc(p.depende.valor) + '"' +
        (valorPrevio(p.depende.id) === p.depende.valor ? '' : ' hidden') : '';
      let control;
      const actual = valorPrevio(p.id);
      if (p.tipo === 'select') {
        control = '<select class="select" name="f_' + p.id + '"><option value="">Selecciona…</option>' +
          p.opciones.map(function (o) { return '<option' + (actual === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
      } else if (p.tipo === 'textarea') {
        control = '<textarea class="textarea" name="f_' + p.id + '">' + esc(actual) + '</textarea>';
      } else {
        control = '<input class="input" type="' + (p.tipo === 'number' ? 'number' : p.tipo) +
          '" step="any" name="f_' + p.id + '"' + v(actual) + '>';
      }
      return titulo + '<div class="field' + full + '"' + dep + '><label>' + esc(p.texto) + req + '</label>' + control + '</div>';
    }).join('') + (seccionActual === null ? '' : '</div>');

    const descripciones = unicos(d.catalogo.map(function (x) { return x.d; })).sort();

    return '<form class="card-body" id="form-sol' + sfx + '"' + (ed ? ' data-num="' + esc(sol.numero) + '"' : '') +
      ' autocomplete="off" novalidate>' +
      '<div class="section-title">Datos generales</div>' +
      '<div class="fields">' +
        '<div class="field"><label>Nombre del proyecto <span class="req">*</span></label>' +
          '<input class="input" name="proyecto" placeholder="Ej. Línea Melamina Norte"' + v(ed && sol.proyecto) + '></div>' +
        '<div class="field"><label>Solicitante <span class="req">*</span></label>' +
          '<input class="input" name="solicitante" value="' + esc(ed ? sol.solicitante : nombreDesdeCorreo(d.usuario)) + '"></div>' +
        '<div class="field"><label>¿Es de exportación? <span class="req">*</span></label>' +
          '<select class="select" name="exportacion">' + opcionesSiNo(ed ? (sol.exportacion ? 'Sí' : 'No') : '') + '</select>' +
          '<span class="hint">Si es Sí, se agrega Operaciones Portuarias al final.</span></div>' +
        '<div class="field"><label>¿Requiere producción? <span class="req">*</span></label>' +
          '<select class="select" name="produccion">' + opcionesSiNo(ed ? (sol.produccion ? 'Sí' : 'No') : '') + '</select>' +
          '<span class="hint">Si es Sí, se agrega Producción antes de Operaciones.</span></div>' +
        '<div class="route" data-ruta></div>' +
      '</div>' +

      '<div class="section-title">Material</div>' +
      '<div class="fields">' +
        '<div class="field full"><label>Material (descripción) <span class="req">*</span></label>' +
          '<input class="input" name="material" list="dl-mat' + sfx + '" placeholder="Escribe para buscar… ej. MDF STD"' + v(ed && sol.material) + '>' +
          '<datalist id="dl-mat' + sfx + '">' + descripciones.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' +
          '<span class="hint" data-hint>' + descripciones.length + ' materiales disponibles en Reglas.</span></div>' +
        '<div class="field"><label>Tipo de material <span class="req">*</span></label>' +
          '<select class="select" name="tipo" disabled><option value="">Primero elige el material</option></select></div>' +
        '<div class="field"><label>Subfamilia <span class="req">*</span></label>' +
          '<select class="select" name="subfamilia" disabled><option value="">Primero elige el tipo</option></select></div>' +
        '<div class="match" data-match>✓ <span></span></div>' +
      '</div>' +

      preguntas +

      '<div class="actions">' +
        (ed ? '<button type="button" class="btn btn-ghost" data-cancelar>Cancelar</button>' +
              '<button type="submit" class="btn btn-primary">Guardar cambios</button>'
            : '<button type="reset" class="btn btn-ghost">Limpiar</button>' +
              '<button type="submit" class="btn btn-primary">Ingresar solicitud</button>') +
      '</div>' +
      '</form>';
  }

  function initFormulario(form, sol) {
    if (!form) return;
    const cat = APP.data.catalogo;
    const inMat = form.elements.material, selTipo = form.elements.tipo, selSub = form.elements.subfamilia;
    const hint = form.querySelector('[data-hint]'), match = form.querySelector('[data-match]');

    function filasMaterial() {
      const v = norm(inMat.value);
      return cat.filter(function (x) { return norm(x.d) === v; });
    }

    function onMaterial() {
      const filas = filasMaterial();
      selSub.innerHTML = '<option value="">Primero elige el tipo</option>';
      selSub.disabled = true;
      if (!inMat.value.trim()) {
        hint.className = 'hint'; hint.textContent = 'Escribe para buscar en la hoja Reglas.';
        inMat.classList.remove('invalid');
      } else if (!filas.length) {
        hint.className = 'hint bad'; hint.textContent = 'Este material no existe en la hoja Reglas.';
        inMat.classList.add('invalid');
      } else {
        inMat.value = filas[0].d;
        hint.className = 'hint ok'; hint.textContent = 'Material encontrado en Reglas.';
        inMat.classList.remove('invalid');
      }
      const tipos = unicos(filas.map(function (x) { return x.t; }));
      selTipo.innerHTML = '<option value="">' + (tipos.length ? 'Selecciona el tipo…' : 'Primero elige el material') + '</option>' +
        tipos.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
      selTipo.disabled = !tipos.length;
      if (tipos.length === 1) selTipo.value = tipos[0];
      onTipo();
    }

    function onTipo() {
      const filas = filasMaterial().filter(function (x) { return x.t === selTipo.value; });
      selSub.innerHTML = '<option value="">' + (filas.length ? 'Selecciona la subfamilia…' : 'Primero elige el tipo') + '</option>' +
        filas.map(function (x) {
          return '<option value="' + esc(x.s) + '">' + esc(x.s + (x.sn ? ' — ' + x.sn : '')) + '</option>';
        }).join('');
      selSub.disabled = !filas.length;
      if (filas.length === 1) selSub.value = filas[0].s;
      onSub();
    }

    function onSub() {
      const fila = filasMaterial().filter(function (x) { return x.t === selTipo.value && x.s === selSub.value; })[0];
      match.classList.toggle('show', !!fila);
      if (fila) match.querySelector('span').textContent =
        'Combinación válida: ' + fila.d + ' · ' + fila.t + ' · ' + fila.s + (fila.sn ? ' (' + fila.sn + ')' : '');
    }

    inMat.addEventListener('change', onMaterial);
    inMat.addEventListener('input', function () { if (filasMaterial().length || !inMat.value) onMaterial(); });
    selTipo.addEventListener('change', onTipo);
    selSub.addEventListener('change', onSub);
    function onRuta() {
      const flags = { exportacion: form.elements.exportacion.value === 'Sí', produccion: form.elements.produccion.value === 'Sí' };
      const pasos = APP.data.pasos.filter(function (p) { return !p.condicion || flags[p.condicion]; }).map(function (p) {
        return p.etapas.map(function (id) { return etapa(id).nombre; }).join(' + ');
      });
      form.querySelector('[data-ruta]').innerHTML = '<b>Recorrido:</b> Solicitud → ' + pasos.map(esc).join(' → ');
    }
    form.elements.exportacion.addEventListener('change', onRuta);
    form.elements.produccion.addEventListener('change', onRuta);
    form.addEventListener('reset', function () { setTimeout(onRuta, 0); });
    onRuta();
    form.addEventListener('reset', function () { setTimeout(onMaterial, 0); });
    form.addEventListener('submit', enviarSolicitud);

    // Preguntas que dependen de otra (ej. "Tipo de Pigmento" sólo si "¿Tiene Pigmento?" = SI)
    function onDependencias() {
      form.querySelectorAll('[data-dep]').forEach(function (f) {
        const padre = form.elements['f_' + f.dataset.dep];
        f.hidden = !padre || padre.value !== f.dataset.depValor;
      });
    }
    form.addEventListener('change', function (ev) {
      if (ev.target.name && ev.target.name.indexOf('f_') === 0) onDependencias();
    });
    form.addEventListener('reset', function () { setTimeout(onDependencias, 0); });

    if (sol) {   // edición: precargar la combinación guardada
      onMaterial();
      selTipo.value = sol.tipo; onTipo();
      selSub.value = sol.subfamilia; onSub();
    }
  }

  function enviarSolicitud(ev) {
    ev.preventDefault();
    const form = ev.target;
    const btn = form.querySelector('[type=submit]');
    const el = form.elements;
    const datos = {
      proyecto: el.proyecto.value,
      solicitante: el.solicitante.value,
      material: el.material.value,
      tipo: el.tipo.value,
      subfamilia: el.subfamilia.value,
      exportacion: el.exportacion.value,
      produccion: el.produccion.value,
      factibilidad: {}
    };

    // Validación en el cliente (el servidor vuelve a validar todo)
    let faltan = [];
    form.querySelectorAll('.invalid').forEach(function (x) { x.classList.remove('invalid'); });
    function marcar(control, etiqueta) { control.classList.add('invalid'); faltan.push(etiqueta); }
    if (!datos.proyecto.trim()) marcar(el.proyecto, 'Proyecto');
    if (!datos.solicitante.trim()) marcar(el.solicitante, 'Solicitante');
    if (!datos.exportacion) marcar(el.exportacion, '¿Es de exportación?');
    if (!datos.produccion) marcar(el.produccion, '¿Requiere producción?');
    const valido = APP.data.catalogo.some(function (x) {
      return norm(x.d) === norm(datos.material) && x.t === datos.tipo && x.s === datos.subfamilia;
    });
    if (!valido) {
      marcar(el.material, 'Material / tipo / subfamilia válidos');
      if (!datos.tipo) el.tipo.classList.add('invalid');
      if (!datos.subfamilia) el.subfamilia.classList.add('invalid');
    }
    APP.data.preguntas.forEach(function (p) {
      const c = el['f_' + p.id];
      const oculto = c.closest('.field').hidden;
      datos.factibilidad[p.id] = oculto ? '' : c.value;
      if (!oculto && p.requerida && !String(c.value).trim()) marcar(c, p.texto);
    });
    if (faltan.length) {
      toast('Revisa los campos: ' + faltan.join(', '), 'bad');
      const primero = form.querySelector('.invalid');
      if (primero) primero.focus();
      return;
    }

    if (form.dataset.num) {
      const num = form.dataset.num;
      cargando(btn, true, 'Guardando…');
      google.script.run
        .withSuccessHandler(function (lista) {
          document.getElementById('modal').hidden = true;
          APP.data.solicitudes = lista;
          const s = lista.filter(function (x) { return x.numero === num; })[0];
          const pend = s ? APP.data.etapas.filter(function (e) { return pendienteEn(s, e.id); }) : [];
          if (APP.vista !== 'SOLICITUD' && pend.length) APP.vista = pend[0].id;
          APP.filtro = 'etapa'; APP.foco = num;
          render();
          toast(num + ' actualizada' + (s ? ' · ' + s.estado : ''), 'ok');
        })
        .withFailureHandler(function (err) { cargando(btn, false); errorToast(err); })
        .editarSolicitud(num, datos);
      return;
    }

    cargando(btn, true, 'Creando solicitud…');
    google.script.run
      .withSuccessHandler(function (res) {
        cargando(btn, false);
        APP.data.solicitudes = res.solicitudes;
        form.reset();
        render();
        modalExito(res);
      })
      .withFailureHandler(function (err) { cargando(btn, false); errorToast(err); })
      .crearSolicitud(datos);
  }

  function modalExito(res) {
    const m = document.getElementById('modal');
    m.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="check">✓</div><h3>Solicitud ingresada</h3>' +
      '<div class="num">' + esc(res.numero) + '</div>' +
      '<p>Se creó el archivo de factibilidad y quedó pendiente de revisión del PMO.</p>' +
      '<div class="row">' +
        '<a class="btn btn-ghost" target="_blank" href="' + esc(res.carpetaUrl) + '">Abrir carpeta</a>' +
        '<a class="btn btn-ghost" target="_blank" href="' + esc(res.factibilidadUrl) + '">Ver factibilidad</a>' +
        '<button class="btn btn-primary" data-cerrar>Ir a PMO</button>' +
      '</div></div>';
    m.hidden = false;
    m.onclick = function (ev) {
      if (ev.target === m) { m.hidden = true; return; }
      if (ev.target.closest('[data-cerrar]')) {
        m.hidden = true;
        APP.vista = 'PMO'; APP.filtro = 'etapa'; APP.foco = res.numero;
        render();
      }
    };
  }

  function abrirEdicion(num) {
    const s = APP.data.solicitudes.filter(function (x) { return x.numero === num; })[0];
    if (!s) return;
    const reinicia = s.etapaActual !== 'PMO';
    const primero = APP.data.pasos[1];
    const m = document.getElementById('modal');
    m.innerHTML = '<div class="modal wide" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><div><div class="req-num">' + esc(s.numero) + '</div><h3>Editar solicitud</h3></div>' +
        '<button class="btn btn-ghost btn-sm" data-cancelar aria-label="Cerrar">✕</button></div>' +
      '<div class="notice' + (reinicia ? ' warn' : '') + '">' +
        (reinicia ? '<b>Atención:</b> al guardar, la solicitud vuelve a <b>' + esc(primero.nombre) + '</b> (' +
            esc(primero.etapas.map(function (id) { return etapa(id).nombre; }).join(' y ')) +
            ') y se reinician todas las aprobaciones posteriores.'
          : 'La solicitud aún está en PMO; los cambios no reinician el flujo.') +
      '</div>' + formularioHtml(s) + '</div>';
    m.hidden = false;
    m.onclick = function (ev) {
      if (ev.target === m || ev.target.closest('[data-cancelar]')) m.hidden = true;
    };
    initFormulario(document.getElementById('form-sol-e'), s);
  }

  /* ---------- Vista: Etapa ---------- */

  function vistaEtapa(id) {
    const e = etapa(id);
    const todas = APP.data.solicitudes;
    const enEtapa = todas.filter(function (s) { return pendienteEn(s, id); });
    let lista = APP.filtro === 'etapa' ? enEtapa : todas;
    const q = norm(APP.busqueda);
    if (q) {
      lista = lista.filter(function (s) {
        return norm([s.numero, s.proyecto, s.material, s.tipo, s.subfamilia, s.solicitante, s.estado].join(' ')).indexOf(q) >= 0;
      });
    }

    const head = '<div class="view-head"><div>' +
      '<h1>' + esc(e.nombre) + '</h1>' +
      '<p>' + (APP.data.pasos.filter(function (p) { return p.id === e.paso; })[0].etapas.length > 1 ?
          'Liberación en paralelo · ' : '') +
        (e.condicion ? esc(etiquetaCondicion(e.condicion)) + ' · ' : '') +
        'Responsable: ' + esc(e.emails.join(', ') || 'sin definir') +
        (esMio(id) ? ' · <b style="color:var(--primary-2)">Puedes cambiar el estado y comentar</b>' : ' · Sólo lectura') + '</p>' +
      '</div><div class="toolbar">' +
        '<div class="chips">' +
          '<button class="chip ' + (APP.filtro === 'etapa' ? 'on' : '') + '" data-filtro="etapa">En esta etapa (' + enEtapa.length + ')</button>' +
          '<button class="chip ' + (APP.filtro === 'todas' ? 'on' : '') + '" data-filtro="todas">Todas (' + todas.length + ')</button>' +
        '</div>' +
        '<input class="input search" id="buscar" placeholder="Buscar nº, proyecto, material…" value="' + esc(APP.busqueda) + '">' +
        '<button class="btn btn-ghost btn-sm" data-refrescar>↻ Actualizar</button>' +
      '</div></div>';

    const cuerpo = lista.length ? '<div class="list">' + lista.map(function (s) { return tarjeta(s, id); }).join('') + '</div>' :
      '<div class="card empty"><div class="big">✓</div>' +
        (APP.filtro === 'etapa' ? 'No hay solicitudes pendientes en ' + esc(e.nombre) + '.' : 'No hay resultados.') + '</div>';

    return head + cuerpo;
  }

  function nodoEtapa(s, e, num) {
    const st = estadoDe(s, e.id);
    let cls = '', icon = num, estado = '—';
    if (!st.aplica) { cls = 'na'; estado = 'No aplica'; icon = '–'; }
    else if (st.estado === 'Aprobado') { cls = 'done'; icon = '✓'; estado = 'Aprobado'; }
    else if (st.estado === 'Rechazado') { cls = 'rejected'; icon = '✕'; estado = 'Rechazado'; }
    else if (s.etapaActual === e.paso) { cls = 'current'; estado = st.estado || 'Pendiente'; }
    return { nombre: e.nombre, cls: cls, estado: estado, icon: icon };
  }

  function miniTimeline(s) {
    function sub(x) {
      return '<div class="tl-dot">' + esc(x.icon) + '</div>' +
        '<div class="tl-name">' + esc(x.nombre) + '</div><div class="tl-state">' + esc(x.estado) + '</div>';
    }
    let html = '<div class="tl-step done">' + sub({ nombre: 'Solicitud', estado: 'Creada', icon: '✓' }) + '</div>';
    APP.data.pasos.forEach(function (p, i) {
      const nodos = p.etapas.map(function (id, j) {
        return nodoEtapa(s, etapa(id), p.etapas.length > 1 ? String(i + 1) + String.fromCharCode(97 + j) : String(i + 1));
      });
      // Clase del paso: el peor estado manda (rechazo > en curso > aprobado)
      const clases = nodos.map(function (n) { return n.cls; });
      const cls = clases.indexOf('rejected') >= 0 ? 'rejected' : clases.indexOf('current') >= 0 ? 'current' :
        clases.every(function (c) { return c === 'done'; }) ? 'done' : clases.every(function (c) { return c === 'na'; }) ? 'na' : '';
      if (nodos.length === 1) { html += '<div class="tl-step ' + cls + '">' + sub(nodos[0]) + '</div>'; return; }
      html += '<div class="tl-step split ' + cls + '"><div class="tl-pair">' + nodos.map(function (n) {
        return '<div class="tl-sub ' + n.cls + '">' + sub(n) + '</div>';
      }).join('') + '</div></div>';
    });
    return '<div class="tl">' + html + '</div>';
  }

  function tarjeta(s, vista) {
    const tl = miniTimeline(s);

    const links = '<div class="req-links">' +
      (s.factibilidadUrl ? '<a class="btn btn-ghost btn-sm" target="_blank" href="' + esc(s.factibilidadUrl) + '">📄 Factibilidad</a>' : '') +
      (s.carpetaUrl ? '<a class="btn btn-ghost btn-sm" target="_blank" href="' + esc(s.carpetaUrl) + '">📁 Carpeta</a>' : '') +
      (s.griffing ? '<a class="btn btn-ghost btn-sm" target="_blank" href="' + esc(s.griffing) + '">Griffing</a>' : '') +
      (esMio('PMO') ? '<button class="btn btn-ghost btn-sm" data-editar="' + esc(s.numero) + '">✎ Editar solicitud</button>' : '') +
      '</div>';

    const puedeActuar = APP.vista !== 'SOLICITUD' && pendienteEn(s, vista) && esMio(vista);
    let accion = '';
    if (puedeActuar) {
      const st = estadoDe(s, vista);
      const paso = APP.data.pasos.filter(function (p) { return p.id === etapa(vista).paso; })[0];
      const otras = paso.etapas.filter(function (id) { return id !== vista && estadoDe(s, id).estado !== 'Aprobado'; });
      const iPaso = APP.data.pasos.indexOf(paso);
      const sig = APP.data.pasos.slice(iPaso + 1).filter(function (p) {
        return !p.condicion || s[p.condicion];
      })[0];
      accion = '<form class="act" data-num="' + esc(s.numero) + '" data-etapa="' + esc(vista) + '">' +
        '<div class="act-title">✎ Actualizar etapa ' + esc(etapa(vista).nombre) + '</div>' +
        '<div class="fields">' +
          '<div class="field"><label>Estado</label><select class="select" name="estado">' +
            APP.data.estados.map(function (e) {
              return '<option' + ((st.estado || 'Pendiente') === e ? ' selected' : '') + '>' + esc(e) + '</option>';
            }).join('') + '</select>' +
            '<span class="hint">' + (otras.length ? 'Al aprobar, espera la liberación de ' +
              esc(otras.map(function (id) { return etapa(id).nombre; }).join(', ')) + '.' :
              sig ? 'Al aprobar pasa a ' + esc(sig.nombre) + '.' : 'Al aprobar la solicitud se finaliza.') + '</span></div>' +
          '<div class="field"><label>Comentario</label><textarea class="textarea" name="comentario" placeholder="Obligatorio si rechazas">' +
            esc(st.comentario || '') + '</textarea></div>' +
        '</div>' +
        '<div class="actions"><button type="submit" class="btn btn-primary">Guardar estado</button></div>' +
        '</form>';
    }

    const notas = APP.data.etapas.map(function (e, i) {
      const st = s.etapas[i] || {};
      if (!st.estado || !st.aplica || st.estado === 'Reiniciado') return '';
      return '<div class="note"><h4>' + esc(e.nombre) + '</h4>' +
        '<span class="pill ' + clasePill(st.estado) + '">' + esc(st.estado) + '</span>' +
        (st.comentario ? '<p>' + esc(st.comentario) + '</p>' : '') +
        (st.responsable ? '<p class="hint">' + esc(st.responsable) + (st.actualizado ? ' · ' + esc(st.actualizado) : '') + '</p>' : '') +
        '</div>';
    }).join('');

    const historial = s.historial.length ? '<ul class="history">' + s.historial.slice().reverse().map(function (h) {
      return '<li><div class="h-top"><b>' + esc(h.etapa) + '</b> · ' + esc(h.estado) + '</div>' +
        '<div class="h-sub">' + esc(h.usuario) + ' · ' + esc(h.fecha) + '</div>' +
        (h.comentario ? '<div class="h-com">' + esc(h.comentario) + '</div>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="hint">Sin movimientos.</p>';

    return '<article class="card req" id="req-' + esc(s.numero) + '">' +
      '<div class="req-top"><div>' +
        '<div class="req-num">' + esc(s.numero) + '</div>' +
        '<div class="req-title">' + esc(s.proyecto) + '</div>' +
        '<div class="req-meta">' +
          '<span>Material: <b>' + esc(s.material) + '</b></span>' +
          '<span>Tipo: <b>' + esc(s.tipo) + '</b></span>' +
          '<span>Subfamilia: <b>' + esc(s.subfamilia) + '</b></span>' +
          '<span>Solicitante: <b>' + esc(s.solicitante) + '</b></span>' +
          '<span>' + esc(s.fecha) + '</span>' +
          (s.exportacion ? '<span class="tag">Exportación</span>' : '') +
          (s.produccion ? '<span class="tag">Producción</span>' : '') +
        '</div></div>' +
        '<span class="pill ' + clasePill(s.estado) + '">' + esc(s.estado) + '</span>' +
      '</div>' +
      tl + accion + links +
      '<details class="more"><summary>Detalle y comentarios</summary>' +
        (notas ? '<div class="stage-notes">' + notas + '</div>' : '') + historial +
      '</details>' +
      '</article>';
  }

  /* ===================== Eventos del contenido ===================== */

  const main = document.getElementById('main');

  main.addEventListener('click', function (ev) {
    const f = ev.target.closest('[data-filtro]');
    if (f) { APP.filtro = f.dataset.filtro; render(); return; }
    if (ev.target.closest('[data-refrescar]')) { refrescar(); return; }
    const ed = ev.target.closest('[data-editar]');
    if (ed) { abrirEdicion(ed.dataset.editar); return; }
    const ir = ev.target.closest('[data-ir]');
    if (ir) {
      const s = APP.data.solicitudes.filter(function (x) { return x.numero === ir.dataset.ir; })[0];
      if (!s) return;
      const pend = APP.data.etapas.filter(function (e) { return pendienteEn(s, e.id); });
      const mia = pend.filter(function (e) { return esMio(e.id); })[0];
      const destino = mia || pend[0];
      APP.vista = destino ? destino.id : 'PMO';
      APP.filtro = destino ? 'etapa' : 'todas';
      APP.busqueda = '';
      APP.foco = s.numero;
      render();
    }
  });

  let tBusqueda;
  main.addEventListener('input', function (ev) {
    if (ev.target.id !== 'buscar') return;
    clearTimeout(tBusqueda);
    tBusqueda = setTimeout(function () {
      APP.busqueda = ev.target.value;
      const pos = ev.target.selectionStart;
      render();
      const b = document.getElementById('buscar');
      b.focus();
      b.setSelectionRange(pos, pos);
    }, 250);
  });

  main.addEventListener('submit', function (ev) {
    const form = ev.target.closest('form.act');
    if (!form) return;
    ev.preventDefault();
    const estado = form.elements.estado.value;
    const comentario = form.elements.comentario.value;
    if (estado === 'Rechazado' && !comentario.trim()) {
      form.elements.comentario.classList.add('invalid');
      form.elements.comentario.focus();
      toast('Debes dejar un comentario al rechazar.', 'bad');
      return;
    }
    const btn = form.querySelector('[type=submit]');
    const num = form.dataset.num;
    cargando(btn, true);
    google.script.run
      .withSuccessHandler(function (lista) {
        APP.data.solicitudes = lista;
        APP.foco = num;
        render();
        toast(num + ': estado actualizado a "' + estado + '"', 'ok');
      })
      .withFailureHandler(function (err) { cargando(btn, false); errorToast(err); })
      .actualizarEtapa(num, form.dataset.etapa, estado, comentario);
  });
</script>
